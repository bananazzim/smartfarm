<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 896" role="img" aria-labelledby="title desc">
  <title id="title">수식 배경 효과와 3D 센서 배치</title>
  <desc id="desc">학습 오차 수식이 배경에 은은하게 흩어지고, 세 개의 입체 센서와 후보 좌표가 공간 격자 위에 표현된 시각화</desc>
  <defs>
    <linearGradient id="background" x2="0" y2="1">
      <stop stop-color="#fffdfc"/>
      <stop offset="1" stop-color="#f7f2f3"/>
    </linearGradient>
    <radialGradient id="light" cx=".53" cy=".47" r=".63">
      <stop stop-color="#fff" stop-opacity=".92"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sensor-body" x1="0" x2="1">
      <stop stop-color="#fff"/>
      <stop offset=".42" stop-color="#f7f5f5"/>
      <stop offset=".76" stop-color="#e9e5e7"/>
      <stop offset="1" stop-color="#d1c9ce"/>
    </linearGradient>
    <linearGradient id="sensor-top" x2="0" y2="1">
      <stop stop-color="#fff"/>
      <stop offset="1" stop-color="#e8e3e5"/>
    </linearGradient>
    <linearGradient id="sensor-base" x2="0" y2="1">
      <stop stop-color="#e8e4e6"/>
      <stop offset="1" stop-color="#c7bec3"/>
    </linearGradient>
    <linearGradient id="coral" x2="0" y2="1">
      <stop stop-color="#f5828d"/>
      <stop offset="1" stop-color="#c83e59"/>
    </linearGradient>
    <linearGradient id="floor" x2=".8" y2="1">
      <stop stop-color="#fff" stop-opacity=".93"/>
      <stop offset="1" stop-color="#eee8eb" stop-opacity=".93"/>
    </linearGradient>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <clipPath id="floor-clip">
      <polygon points="58,608 551,366 1142,603 627,837"/>
    </clipPath>
    <g id="probe">
      <ellipse cy="9" rx="34" ry="12" fill="#75636a" opacity=".19" filter="url(#shadow)"/>
      <path d="M-23-106Q-23-119 0-124Q23-119 23-106V1Q23 14 0 18Q-23 14-23 1Z" fill="url(#sensor-body)" stroke="#cec6ca" stroke-width="2"/>
      <ellipse cy="-106" rx="23" ry="10" fill="url(#sensor-top)" stroke="#d8d1d4" stroke-width="2"/>
      <ellipse cy="1" rx="23" ry="10" fill="url(#sensor-base)" stroke="#cfc7cb" stroke-width="2"/>
      <path d="M-23-91Q0-83 23-91" fill="none" stroke="#fff" stroke-width="2" opacity=".9"/>
      <g fill="#a79da1">
        <rect x="-9" y="-75" width="18" height="3.2" rx="1.6"/>
        <rect x="-10" y="-64" width="20" height="3.2" rx="1.6"/>
        <rect x="-10" y="-53" width="20" height="3.2" rx="1.6"/>
        <rect x="-9" y="-42" width="18" height="3.2" rx="1.6"/>
      </g>
      <circle cy="-25" r="4.2" fill="#d7576b"/>
      <circle cy="-25" r="9" fill="#d7576b" opacity=".12"/>
    </g>
  </defs>

  <rect width="1200" height="896" fill="url(#background)"/>
  <rect width="1200" height="896" fill="url(#light)"/>
  <circle cx="105" cy="121" r="112" fill="#faecec" opacity=".44"/>
  <circle cx="1086" cy="792" r="151" fill="#e8eff1" opacity=".44"/>

  <g fill="#473d42" font-family="Georgia, 'Times New Roman', serif" font-style="italic">
    <text x="35" y="163" font-size="52" opacity=".48" transform="rotate(-8 35 163)">MAE = (1/n) Σ |yᵢ − ŷᵢ|</text>
    <text x="606" y="145" font-size="42" opacity=".44" transform="rotate(5 606 145)">S* = arg min<tspan baseline-shift="sub" font-size="23">S</tspan> (MAE<tspan baseline-shift="sub" font-size="23">T</tspan> + MAE<tspan baseline-shift="sub" font-size="23">RH</tspan>)</text>
    <text x="901" y="278" font-size="39" opacity=".4" transform="rotate(-7 901 278)">eᵢ = yᵢ − ŷᵢ</text>
    <text x="23" y="776" font-size="45" opacity=".45" transform="rotate(6 23 776)">RMSE = √(Σ eᵢ² / n)</text>
    <text x="847" y="823" font-size="39" opacity=".44" transform="rotate(-5 847 823)">Σ MAE(S) → min</text>
    <text x="442" y="236" font-size="33" opacity=".4" transform="rotate(-4 442 236)">ΔT · ΔRH · n</text>
    <text x="65" y="388" font-size="41" opacity=".42" transform="rotate(7 65 388)">∑ᵢ₌₁ⁿ |eᵢ|</text>
    <text x="930" y="423" font-size="35" opacity=".4" transform="rotate(-6 930 423)">ΔRH = RH<tspan baseline-shift="sub" font-size="20">ref</tspan> − RH<tspan baseline-shift="sub" font-size="20">pred</tspan></text>
    <text x="794" y="708" font-size="37" opacity=".42" transform="rotate(5 794 708)">S = {S₁, S₂, S₃}</text>
    <text x="255" y="824" font-size="35" opacity=".42" transform="rotate(-5 255 824)">T̄ = (1/n) Σ Tᵢ</text>
    <text x="1101" y="566" font-size="59" opacity=".38">∑</text>
    <text x="141" y="539" font-size="48" opacity=".38">√</text>
    <text x="1072" y="186" font-size="48" opacity=".38">Δ</text>
  </g>
  <g fill="none" stroke="#c83e59" stroke-width="2" opacity=".18">
    <path d="M78 225c53-25 98-25 148 0"/>
    <path d="M939 186c49-20 98-20 144 0"/>
    <circle cx="1061" cy="358" r="5"/>
    <circle cx="157" cy="466" r="4"/>
    <path d="M973 359h70m-35-35v70"/>
  </g>

  <ellipse cx="595" cy="779" rx="423" ry="43" fill="#76616a" opacity=".12" filter="url(#shadow)"/>
  <polygon points="58,608 551,366 1142,603 627,837" fill="url(#floor)" stroke="#ded5d9" stroke-width="2"/>
  <g clip-path="url(#floor-clip)" fill="none" stroke="#ded6da" stroke-width="2" opacity=".82">
    <path d="M0 579 655 856M76 542 731 819M152 505 807 782M228 468 883 745M304 431 959 708M380 394 1035 671M456 357 1111 634M532 320 1187 597M608 283 1263 560"/>
    <path d="m32 621 1110-510M67 652l1110-510M102 683l1110-510M137 714l1110-510M172 745l1110-510M207 776l1110-510M242 807l1110-510"/>
  </g>

  <g fill="none" stroke="#b8aab0" stroke-width="2" stroke-dasharray="5 9" opacity=".83">
    <path d="M328 610V468"/>
    <path d="M600 724V573"/>
    <path d="M876 610V463"/>
  </g>
  <g fill="none" stroke="#c83e59" stroke-width="2.5" stroke-dasharray="5 8" opacity=".68">
    <path d="M328 610 600 724 876 610Z"/>
  </g>
  <g>
    <use href="#probe" transform="translate(328 469) scale(1.28)"/>
    <use href="#probe" transform="translate(600 575) scale(1.12)"/>
    <use href="#probe" transform="translate(876 464) scale(1.3)"/>
  </g>
  <g font-family="Arial, sans-serif" font-size="15" font-weight="700" text-anchor="middle">
    <g transform="translate(328 610)">
      <ellipse cy="8" rx="23" ry="8" fill="#6a5660" opacity=".13"/>
      <circle r="13" fill="#fff" stroke="#c83e59" stroke-width="2"/>
      <circle r="5.5" fill="url(#coral)"/>
      <text y="34" fill="#bd3c56">S₁</text>
    </g>
    <g transform="translate(600 724)">
      <ellipse cy="8" rx="23" ry="8" fill="#6a5660" opacity=".13"/>
      <circle r="13" fill="#fff" stroke="#c83e59" stroke-width="2"/>
      <circle r="5.5" fill="url(#coral)"/>
      <text y="34" fill="#bd3c56">S₂</text>
    </g>
    <g transform="translate(876 610)">
      <ellipse cy="8" rx="23" ry="8" fill="#6a5660" opacity=".13"/>
      <circle r="13" fill="#fff" stroke="#c83e59" stroke-width="2"/>
      <circle r="5.5" fill="url(#coral)"/>
      <text y="34" fill="#bd3c56">S₃</text>
    </g>
  </g>

  <g font-family="Arial, sans-serif" font-size="15" font-weight="700">
    <path d="M103 652 66 672" stroke="#c83e59" stroke-width="3"/>
    <path d="M103 652 103 604" stroke="#85a377" stroke-width="3"/>
    <path d="M103 652 140 672" stroke="#718da0" stroke-width="3"/>
    <text x="51" y="684" fill="#c83e59">x</text>
    <text x="98" y="595" fill="#718d67">z</text>
    <text x="148" y="680" fill="#718da0">y</text>
  </g>
</svg>
