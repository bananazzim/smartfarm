<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GSO 3D 시뮬레이터</title>
<meta name="description" content="단동 토마토 온실 내부를 1인칭으로 탐색하며 센서 설치 위치를 확인합니다.">
<style>
:root{--bg:#f3f4ef;--card:#fff;--ink:#1d2a22;--mute:#69756d;--line:#e2e6dd;--acc:#2f7d4f;--soft:#eaf3ec;--red:#d93636;--glass:rgba(255,255,255,.8);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111512;--card:#1a201c;--ink:#e8ede9;--mute:#9aa69e;--line:#2a322d;--acc:#79d19c;--soft:#223329;--glass:rgba(22,28,24,.8)}}
:root[data-theme="dark"]{--bg:#111512;--card:#1a201c;--ink:#e8ede9;--mute:#9aa69e;--line:#2a322d;--acc:#79d19c;--soft:#223329;--glass:rgba(22,28,24,.8)}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 "Pretendard","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif}
*{box-sizing:border-box}
.app{height:100%;display:flex;flex-direction:column;gap:14px;padding:18px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{margin:0;font-size:22px;font-weight:700;letter-spacing:-.03em}
.sub{color:var(--mute);margin-top:2px;font-size:13px}
.chip{display:inline-block;margin-left:8px;padding:2px 10px;border-radius:99px;background:var(--soft);color:var(--acc);font-size:12px;font-weight:600;vertical-align:middle}
.actions{display:flex;gap:8px}
button{font:inherit;color:inherit;cursor:pointer}
.btn{border:1px solid var(--line);background:var(--card);padding:8px 14px;border-radius:12px;font-weight:600}
.btn:hover{border-color:var(--acc)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
:root[data-theme="dark"] .btn.pri,:root:not([data-theme="light"]) .btn.pri{color:#0e1a12}
button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
main{flex:1;min-height:0;display:grid;grid-template-columns:1fr 310px;gap:14px}
.stage{position:relative;border-radius:22px;overflow:hidden;background:#cfe3e6;min-height:340px;touch-action:none}
#cv{display:block;width:100%;height:100%;cursor:grab}
.stage.lock #cv{cursor:none}
.lbls{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.lbl{position:absolute;left:0;top:0;display:flex;gap:6px;align-items:center;padding:3px 9px;border-radius:99px;background:rgba(255,255,255,.92);color:#1d2a22;font-size:12px;font-weight:600;white-space:nowrap;box-shadow:0 1px 6px rgba(0,0,0,.16);transition:opacity .15s}
.lbl i{font-style:normal;font-weight:500;color:#69756d;display:none}.lbl em{font-style:normal;color:#b82a2a;display:none}
.lbl.n i,.lbl.sel i{display:inline}.lbl.n em,.lbl.sel em{display:inline}
.lbl.rec{border:1.5px dashed #d93636}
.lbl.sel{background:#d93636;color:#fff}.lbl.sel i,.lbl.sel em{color:#fff}
.cross{position:absolute;left:50%;top:50%;width:8px;height:8px;margin:-4px;border-radius:50%;background:rgba(255,255,255,.9);box-shadow:0 0 0 1.5px rgba(0,0,0,.35);opacity:0;transition:.12s}
.stage.lock .cross{opacity:1}.cross.on{width:18px;height:18px;margin:-9px;background:rgba(217,54,54,.25);box-shadow:0 0 0 2px #d93636}
.pill{position:absolute;background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-radius:14px;padding:8px 12px;font-size:12px;color:var(--ink)}
.keys{left:14px;bottom:14px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;max-width:calc(100% - 28px)}
kbd{font:600 11px/1 inherit;background:var(--card);border:1px solid var(--line);border-bottom-width:2px;border-radius:6px;padding:3px 6px;margin-right:2px}
.hint{top:14px;left:50%;transform:translateX(-50%);font-weight:600;transition:opacity .2s}
.stage.lock .hint{opacity:0}
.toast{top:14px;right:14px;opacity:0;transition:opacity .2s}.toast.on{opacity:1}
aside{display:flex;flex-direction:column;gap:12px;min-height:0;overflow:auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px}
.card h2{margin:0 0 8px;font-size:14px;font-weight:700}
.list{display:flex;flex-direction:column;gap:6px;max-height:240px;overflow:auto}
.item{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:1px solid var(--line);background:transparent;border-radius:12px;padding:8px 10px}
.item:hover{border-color:var(--acc)}.item.on{background:var(--soft);border-color:var(--acc)}
.dot{width:12px;height:12px;border-radius:50%;background:var(--red);flex:none}.dot.rec{background:transparent;border:2px dashed var(--red)}
.item b{font-size:14px}.item small{display:block;color:var(--mute);font-size:12px}
.tag{margin-left:auto;font-size:11px;color:var(--mute)}
dl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0}dt{color:var(--mute)}dd{margin:0;text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
.empty,.note{color:var(--mute);font-size:12px}.warn{color:#b8651b;font-size:12px;margin-top:8px}
.go{width:100%;margin-top:12px}
[hidden]{display:none!important}
.warn select{margin-top:6px;width:100%;font:inherit;padding:6px 8px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
@media (max-width:860px){.app{height:auto;min-height:100%;padding:12px}main{grid-template-columns:1fr;grid-template-rows:62vh auto}.keys{display:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <header>
    <div>
      <h1>3D 시뮬레이터 <span class="chip" id="ghName">DEMO</span></h1>
      <div class="sub" id="ghDim">단동 토마토 온실 내부를 걸어 다니며 센서 설치 위치를 확인합니다</div>
    </div>
    <div class="actions">
      <button class="btn" id="reset" title="R">처음 위치로</button>
      <button class="btn pri" id="fs">전체화면</button>
    </div>
  </header>
  <main>
    <section class="stage" id="stage">
      <canvas id="cv" tabindex="0" aria-label="3D 온실 뷰포트"></canvas>
      <div class="lbls" id="lbls"></div>
      <div class="cross" id="cross"></div>
      <div class="pill hint" id="hint">화면을 클릭하면 시점 조작이 시작됩니다</div>
      <div class="pill toast" id="toast"></div>
      <div class="pill keys"><span><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> 이동</span><span>마우스 시점</span><span>휠 속도 <b id="spd">2.2</b> m/s</span><span><kbd>Shift</kbd> 빠르게</span><span><kbd>R</kbd> 처음 위치</span><span><kbd>Esc</kbd> 해제</span></div>
    </section>
    <aside>
      <div class="card"><h2>센서 목록 <span class="tag" id="cnt"></span></h2><div class="list" id="list"></div><div class="warn" id="warn"></div></div>
      <div class="card" id="detail"><h2>센서 상세</h2><div class="empty">목록이나 화면의 빨간 마커를 선택하세요.</div></div>
      <div class="note"><span id="demoNote">DEMO 좌표는 예시이며 최적 배치 결과가 아닙니다. </span>이 화면은 센서 위치를 보여주는 공간 탐색 도구이고, 온도 분포나 기류를 추정하지 않습니다.</div>
    </aside>
  </main>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
"use strict";
if (window.GSOSim && window.GSOSim.destroy) { try { window.GSOSim.destroy(); } catch (_) {} }
const T = THREE, $ = s => document.querySelector(s);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const EYE = 1.6, RAD = 0.32;
let cfg = { name: "DEMO", length: 30, width: 7, height: 4 };

/* 연구 좌표계(x 길이, y 폭, z 높이, m) -> Three(X, Y-up, Z). 기존 GSO toScene과 동일 방향 */
const toThree = (x, y, z) => new T.Vector3(x, z, y);

/* ---------- 렌더러 / 씬 ---------- */
const stage = $("#stage"), cv = $("#cv");
const renderer = new T.WebGLRenderer({ canvas: cv, antialias: true, powerPreference: "high-performance" });
renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 1.75));
renderer.shadowMap.enabled = true; renderer.shadowMap.type = T.PCFSoftShadowMap; renderer.shadowMap.autoUpdate = false;
const scene = new T.Scene(); scene.background = new T.Color(0xcfdadf); scene.fog = new T.Fog(0xd3dcdc, 55, 150);
const cam = new T.PerspectiveCamera(70, 1, 0.05, 300); cam.rotation.order = "YXZ";
scene.add(new T.HemisphereLight(0xf0f1ea, 0x7a7f66, 0.95));
const sun = new T.DirectionalLight(0xfff4e2, 0.85); sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048); sun.shadow.bias = -0.0004;
scene.add(sun, sun.target);
const markerRoot = new T.Group(); scene.add(markerRoot);
let world = null, rects = [], npcs = [];

const M = (c, o) => new T.MeshStandardMaterial(Object.assign({ color: c, roughness: 0.88, flatShading: true }, o || {}));
const E = new T.Euler(), Q = new T.Quaternion(), V = new T.Vector3(), S3 = new T.Vector3();
const mk = (x, y, z, ry = 0, rz = 0, sx = 1, sy = sx, sz = sx) => { E.set(0, ry, rz, "YZX"); return new T.Matrix4().compose(V.set(x, y, z), Q.setFromEuler(E), S3.set(sx, sy, sz)); };
const rng = a => () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
function inst(geo, mat, items, cast = true) {
  const m = new T.InstancedMesh(geo, mat, items.length);
  items.forEach((it, i) => { m.setMatrixAt(i, it.m); if (it.c) m.setColorAt(i, it.c); });
  m.castShadow = cast; m.receiveShadow = true; m.frustumCulled = false; m.instanceMatrix.needsUpdate = true; return m;
}
const disposeTree = o => o.traverse(c => { if (c.geometry) c.geometry.dispose(); if (c.material) [].concat(c.material).forEach(m => m.dispose()); if (c.dispose && c.isInstancedMesh) c.dispose(); });

/* ---------- 온실 구성 ---------- */
function build() {
  if (world) { scene.remove(world); disposeTree(world); }
  const { length: L, width: W, height: H } = cfg, g = world = new T.Group(); scene.add(g);
  const wallH = H * 0.45, arc = H - wallH, DH = 2.3, DW = 1.4, N = 24;
  const prof = []; for (let i = 0; i <= N; i++) { const t = Math.PI * i / N; prof.push([W / 2 - W / 2 * Math.cos(t), wallH + arc * Math.sin(t)]); }
  const wood = M(0xa9aea6), bedWood = M(0x8c8a7c), film = M(0xeef1ec, { transparent: true, opacity: 0.3, roughness: 0.3, side: T.DoubleSide, depthWrite: false, flatShading: false });
  const add = (geo, mat, x, y, z, o = {}) => { const m = new T.Mesh(geo, mat); m.position.set(x, y, z); m.castShadow = !!o.cast; m.receiveShadow = o.recv !== false; if (o.rz) m.rotation.z = o.rz; g.add(m); return m; };

  // 지면 슬래브 + 출입 통로
  const grass = M(0x7a8f54), dirt = M(0x5f4c3a);
  add(new T.PlaneBufferGeometry(600, 600), M(0x7f9159), L / 2, -0.06, W / 2).rotation.x = -Math.PI / 2;
  const slab = add(new T.BoxGeometry(L + 34, 0.6, W + 30), [dirt, dirt, grass, dirt, dirt, dirt], L / 2 - 8, -0.3, W / 2);
  add(new T.BoxGeometry(14, 0.03, 1.9), M(0xbdb59d), -7, 0.012, W / 2);
  add(new T.BoxGeometry(L, 0.03, W), M(0x8f8a76), L / 2, 0.01, W / 2);
  add(new T.BoxGeometry(L, 0.04, 1.5), M(0xa7a28e), L / 2, 0.03, W / 2);

  // 아치 골조
  const pts = [[0, 0], [0, wallH / 2], ...prof, [W, wallH / 2], [W, 0]].map(p => new T.Vector3(0, p[1], p[0]));
  const rib = new T.TubeBufferGeometry(new T.CatmullRomCurve3(pts, false, "centripetal"), 72, 0.06, 5, false);
  const n = Math.max(2, Math.round(L / 2.5) + 1);
  g.add(inst(rib, wood, Array.from({ length: n }, (_, i) => ({ m: mk(L * i / (n - 1), 0, 0) }))));
  const rod = new T.CylinderBufferGeometry(0.03, 0.03, L, 5);
  [0, 4, 8, 12, 16, 20, 24].forEach(i => add(rod, wood, L / 2, prof[i][1], prof[i][0], { cast: true, rz: Math.PI / 2 }));
  [0, W].forEach(z => add(new T.BoxGeometry(L, 0.14, 0.09), wood, L / 2, 0.07, z, { cast: true }));

  // 피복(비닐) — 측면/지붕 + 양 끝 벽
  const prow = [[0, 0], ...prof, [W, 0]], pos = [], idx = [];
  prow.forEach((p, i) => { pos.push(0, p[1], p[0], L, p[1], p[0]); if (i < prow.length - 1) { const a = i * 2; idx.push(a, a + 2, a + 1, a + 1, a + 2, a + 3); } });
  const fg = new T.BufferGeometry(); fg.setAttribute("position", new T.Float32BufferAttribute(pos, 3)); fg.setIndex(idx); fg.computeVertexNormals();
  add(fg, film, 0, 0, 0, { recv: false }).renderOrder = 2;
  const endShape = door => { const s = new T.Shape(); s.moveTo(0, 0); if (door) { s.lineTo(W / 2 - DW / 2, 0); s.lineTo(W / 2 - DW / 2, DH); s.lineTo(W / 2 + DW / 2, DH); s.lineTo(W / 2 + DW / 2, 0); } s.lineTo(W, 0); for (let i = N; i >= 0; i--) s.lineTo(prof[i][0], prof[i][1]); s.closePath(); return new T.ShapeBufferGeometry(s); };
  [[0, true], [L, false]].forEach(([x, d]) => { const m = add(endShape(d), film, x, 0, 0, { recv: false }); m.rotation.y = -Math.PI / 2; m.renderOrder = 2; });

  // 측면 환기창 + 출입문
  [0.012, W - 0.012].forEach(z => {
    add(new T.PlaneBufferGeometry(L, 0.6), M(0xe6ebde, { transparent: true, opacity: 0.42, side: T.DoubleSide, depthWrite: false }), L / 2, 1.15, z, { recv: false }).renderOrder = 3;
    [0.85, 1.45].forEach(y => add(new T.BoxGeometry(L, 0.05, 0.07), wood, L / 2, y, z, { cast: true }));
    add(rod, M(0xfff8e8, { transparent: true, opacity: 0.8 }), L / 2, 1.52, z, { rz: Math.PI / 2 }).scale.set(1.7, 1, 1.7);
  });
  [W / 2 - DW / 2, W / 2 + DW / 2].forEach(z => add(new T.BoxGeometry(0.09, DH, 0.09), wood, 0, DH / 2, z, { cast: true }));
  add(new T.BoxGeometry(0.09, 0.09, DW + 0.09), wood, 0, DH, W / 2, { cast: true });
  const door = new T.Group(); door.position.set(0, 0, W / 2 + DW / 2 - 0.04); door.rotation.y = 1.75; g.add(door);
  const dw = DW - 0.1, dh = DH - 0.08;
  const dp = new T.Mesh(new T.PlaneBufferGeometry(dw, dh), film); dp.rotation.y = Math.PI / 2; dp.position.set(0, dh / 2 + 0.02, -dw / 2); door.add(dp);
  [[0, dh / 2, 0, 0.06, dh, 0.06], [0, dh / 2, -dw, 0.06, dh, 0.06], [0, dh, -dw / 2, 0.06, 0.06, dw], [0, 0.04, -dw / 2, 0.06, 0.06, dw], [0, dh / 2, -dw / 2, 0.05, 0.04, dw]].forEach(a => { const b = new T.Mesh(new T.BoxGeometry(a[3], a[4], a[5]), wood); b.position.set(a[0], a[1], a[2]); b.castShadow = true; door.add(b); });

  // 재배 베드 + 지지대
  rects = []; const rnd = rng(7), bedRows = [];
  [-1, 1].forEach(s => {
    const bz = W / 2 + s * 1.7;
    add(new T.BoxGeometry(L - 1, 0.28, 1.1), bedWood, L / 2, 0.14, bz, { cast: true });
    const nt = Math.max(1, Math.floor((L - 1.2) / 2.4)), tl = (L - 1.2) / nt;
    g.add(inst(new T.BoxGeometry(tl - 0.18, 0.06, 0.9), M(0xffffff), Array.from({ length: nt }, (_, i) => ({ m: mk(0.6 + tl * (i + 0.5), 0.29, bz), c: new T.Color(0x5a4535).offsetHSL(0, 0, (rnd() - 0.5) * 0.06) })), false));
    rects.push([0.5 - RAD, bz - 0.55 - RAD, L - 0.5 + RAD, bz + 0.55 + RAD]);
    [0.55, L / 2, L - 0.55].forEach(x => { add(new T.CylinderBufferGeometry(0.03, 0.03, 2.85, 5), wood, x, 1.42, bz, { cast: true }); add(new T.BoxGeometry(0.05, 0.05, 0.7), wood, x, 2.82, bz, { cast: true }); });
    [-1, 1].forEach(r => { bedRows.push(bz + r * 0.22); add(rod, M(0xbfc4c0, { metalness: 0.5, roughness: 0.4 }), L / 2, 2.75, bz + r * 0.22, { rz: Math.PI / 2 }).scale.set(0.3, 1, 0.3); });
  });

  // 토마토 식물 (InstancedMesh)
  const plants = [];
  bedRows.forEach((bz, ri) => { for (let x = 1.4 + (ri % 2) * 0.27; x <= L - 1.4; x += 0.55) plants.push({ x, z: bz + (rnd() - 0.5) * 0.05, h: 1.9 + rnd() * 0.5, ry: rnd() * 6.28, lean: (rnd() - 0.5) * 0.1 }); });
  const stems = [], leaves = [], fruits = [], calyx = [], flowers = [], strings = [];
  const blades = [mk(0.3, 0, 0), mk(0.2, 0, 0.11, -0.8, 0, 0.62), mk(0.2, 0, -0.11, 0.8, 0, 0.62)];
  const greens = [0x58773a, 0x5f8040, 0x4b6c34, 0x6a8a45], palette = [[0xb83a2e, 0xaa3328], [0xc2452d, 0xb83a2e, 0xc9693a], [0xc98a3c, 0x8fa24f], [0x7c9a4b, 0x73914a]];
  plants.forEach(p => {
    const Pm = mk(p.x, 0, p.z, p.ry, p.lean);
    stems.push({ m: Pm.clone().multiply(mk(0, 0, 0, 0, 0, 1, p.h, 1)), c: new T.Color(0x6a8847).offsetHSL(0, 0, (rnd() - 0.5) * 0.06) });
    const nL = 9;
    for (let k = 0; k < nL; k++) {
      const f = k / (nL - 1), size = (1.15 - 0.45 * f) * (0.85 + rnd() * 0.3), base = Pm.clone().multiply(mk(0, p.h * (0.26 + 0.7 * f), 0, k * 2.4 + rnd() * 0.3, -0.2 - rnd() * 0.35 + f * 0.25, size));
      const col = new T.Color(greens[Math.floor(rnd() * 4)]).offsetHSL(0, 0, (rnd() - 0.5) * 0.06);
      blades.forEach(b => leaves.push({ m: base.clone().multiply(b), c: col }));
    }
    const nT = 3 + (rnd() > 0.5 ? 1 : 0);
    for (let t = 0; t < nT; t++) {
      const hh = p.h * (0.36 + 0.14 * t), ang = rnd() * 6.28, r0 = 0.12 + rnd() * 0.06, nF = 3 + Math.floor(rnd() * 3), pal = palette[Math.min(t, 3)];
      for (let i = 0; i < nF; i++) {
        const rad = 0.042 + rnd() * 0.012, ox = Math.cos(ang) * r0 + (rnd() - 0.5) * 0.1, oz = Math.sin(ang) * r0 + (rnd() - 0.5) * 0.1, oy = hh - 0.05 * i - rnd() * 0.04;
        fruits.push({ m: Pm.clone().multiply(mk(ox, oy, oz, 0, 0, rad)), c: new T.Color(pal[Math.floor(rnd() * pal.length)]).offsetHSL(0, 0, (rnd() - 0.5) * 0.05) });
        calyx.push({ m: Pm.clone().multiply(mk(ox, oy + rad * 0.85, oz, rnd() * 3, 0, rad * 0.6, rad * 0.22, rad * 0.6)) });
      }
    }
    for (let i = 0; i < 2; i++) flowers.push({ m: Pm.clone().multiply(mk((rnd() - 0.5) * 0.12, p.h * (0.96 + 0.03 * i), (rnd() - 0.5) * 0.12, 0, 0, 0.03)) });
    strings.push({ m: mk(p.x, 0.3, p.z, 0, 0, 1, 2.45, 1) });
  });
  g.add(
    inst(new T.CylinderBufferGeometry(0.013, 0.021, 1, 5).translate(0, 0.5, 0), M(0xffffff), stems),
    inst(new T.OctahedronBufferGeometry(1, 0).scale(0.3, 0.025, 0.12), M(0xffffff, { side: T.DoubleSide }), leaves),
    inst(new T.IcosahedronBufferGeometry(1, 1), M(0xffffff, { roughness: 0.55 }), fruits),
    inst(new T.OctahedronBufferGeometry(1, 0), M(0x4b6c34), calyx, false),
    inst(new T.IcosahedronBufferGeometry(1, 0), M(0xe0c258), flowers, false),

/* ---------- 입력 ---------- */
const offs = []; const on = (t, e, f, o) => { t.addEventListener(e, f, o); offs.push(() => t.removeEventListener(e, f, o)); };
const toast = (t) => { const el = $("#toast"); el.textContent = t; el.classList.add("on"); clearTimeout(toast.h); toast.h = setTimeout(() => el.classList.remove("on"), 1100); };
const MOVE = ["KeyW", "KeyA", "KeyS", "KeyD", "ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"];
on(window, "keydown", e => { if (e.ctrlKey || e.metaKey || e.altKey) return; if (e.code === "KeyR") { resetView(true); return; } if (MOVE.includes(e.code) || e.code.startsWith("Shift")) { keys.add(e.code); if (locked || document.activeElement === cv) e.preventDefault(); } });

on(document, "pointerlockchange", () => { locked = document.pointerLockElement === cv; stage.classList.toggle("lock", locked); if (!locked) { keys.clear(); vel.x = vel.z = 0; } });

on(cv, "pointerdown", e => { drag = { x: e.clientX, y: e.clientY, mv: 0 }; cv.setPointerCapture(e.pointerId); cv.focus(); });
on(cv, "pointermove", e => { if (locked) { look(e.movementX, e.movementY); return; } if (drag) { drag.mv += Math.abs(e.clientX - drag.x) + Math.abs(e.clientY - drag.y); look((e.clientX - drag.x) * 1.6, (e.clientY - drag.y) * 1.6); drag.x = e.clientX; drag.y = e.clientY; } });
const ray = new T.Raycaster();

on($("#list"), "click", e => { const b = e.target.closest("[data-id]"); if (b) select(b.dataset.id, true); });
on($("#detail"), "click", e => { const b = e.target.closest("[data-go]"); if (b) flyTo(b.dataset.go); });
on($("#reset"), "click", () => resetView(true));
on($("#fs"), "click", () => { const el = document.querySelector(".app"); if (document.fullscreenElement) document.exitFullscreen(); else if (el.requestFullscreen) el.requestFullscreen().catch(() => toast("전체화면을 사용할 수 없습니다")); });
const ro = new ResizeObserver(() => { const w = stage.clientWidth, h = stage.clientHeight; if (!w || !h) return; renderer.setSize(w, h, false); cam.aspect = w / h; cam.updateProjectionMatrix(); }); ro.observe(stage);

/* ---------- 루프 ---------- */
const clock = new T.Clock(), tv = new T.Vector3(); let raf = 0, dead = false;
function frame() {
  raf = requestAnimationFrame(frame); try { const dt = Math.min(clock.getDelta(), 0.05), t = clock.elapsedTime; step(dt);
  npcs.forEach(n => stepNpc(n, dt));
  cam.position.set(P.x, EYE, P.z); cam.rotation.set(P.pitch, P.yaw, 0);
  const hov = locked ? pick() : null; $("#cross").classList.toggle("on", !!hov);
  const w = stage.clientWidth, h = stage.clientHeight;
  markers.forEach((o, id) => {
    const d = cam.position.distanceTo(o.g.position), s = clamp(d / 6, 0.8, 2.5) * (id === selId ? 1 + 0.12 * Math.sin(t * 5) : 1);
    o.core.scale.setScalar(s); o.halo.scale.setScalar(s * (id === selId ? 2.4 : 1.6)); o.ring.scale.setScalar(s * (id === selId ? 1.3 : 1));
    tv.copy(o.g.position); tv.y += 0.2 * s; tv.project(cam); const vis = tv.z < 1 && tv.z > -1 && Math.abs(tv.x) < 1.1 && Math.abs(tv.y) < 1.1 && (d < 16 || id === selId);
    o.lb.style.opacity = vis ? 1 : 0; if (vis) o.lb.style.transform = `translate(${(tv.x * 0.5 + 0.5) * w}px,${(-tv.y * 0.5 + 0.5) * h}px) translate(-50%,-135%)`;
    o.lb.classList.toggle("n", d < 6); o.lb.classList.toggle("sel", id === selId);

  } catch (e) { if (!frame.err) { frame.err = 1; console.error("[GSOSim] frame error", e); } }
}

/* ---------- 외부 인터페이스 (Django 통합용) ---------- */
function setGreenhouseConfig(c) {
  const n = { name: c && c.name != null ? String(c.name).slice(0, 40) : "", length: num(c && c.length), width: num(c && c.width), height: num(c && c.height) };
  if (![n.length, n.width, n.height].every(v => Number.isFinite(v) && v >= 3)) { console.error("[GSOSim] 유효하지 않은 온실 규격", c); return false; }
  cfg = n; build(); setSensors(rawSensors); resetView(false); return true;
}
function destroy() {

const api = {

  setSensors: safe(l => { isDemo = false; lastRecords = null; adapterIssues = []; histTimes = []; histories = {}; setSensors(l); return true; }, false),

})();
